// ==================== HELPERS ====================
function showToast(msg) {
  const root = document.getElementById('toastRoot');
  root.innerHTML = `
    <div class="toast-box">
      <span style="color:#16a34a; font-weight:bold; font-size:16px;">✓</span>
      <span>${msg}</span>
    </div>
  `;
  setTimeout(() => { root.innerHTML = ''; }, 4500);
}

function formatScore(score) {
  if (score >= 90) return { text: 'Xuất sắc', tone: 'success', color: '#16a34a' };
  if (score >= 70) return { text: 'Khá', tone: 'info', color: '#2563eb' };
  if (score >= 50) return { text: 'Trung bình', tone: 'warning', color: '#d97706' };
  return { text: 'Kém', tone: 'critical', color: '#dc2626' };
}

function pad2(n) { return String(n).padStart(2, '0'); }
function formatTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
}

// Tick timer

}, 1000);

  switch (state.screen) {

    case 'newProfile': return renderNewProfileScreen();
    case 'scoring': return renderScoringScreen();
    case 'approve': return renderApproveScreen();
    case 'alerts': return renderAlertsScreen();
    case 'assign': return renderAssignScreen();
    case 'overview': return renderOverviewScreen();
    case 'ranking': return renderRankingScreen();
    case 'audit': return renderAuditScreen();
    case 'reports': return renderReportsScreen();
    case 'rules': return renderRulesScreen();
    case 'discharge': return renderDischargeScreen();
    case 'notify': return renderNotifyScreen();
    case 'account': return renderAccountScreen();
    default: return renderWorkScreen();
  }
}

function renderRollcallScreen() {
  const currentSession = DB.sessions.find(s => s.date === state.selectedDate) || DB.sessions[DB.sessions.length - 1];
  const isLocked = currentSession.locked;

  return `
    <div style="display: flex; flex-direction: column; gap: 16px;">

        ${DB.sessions.map(s => {
          const on = s.date === state.selectedDate;
          return `
            <div onclick="selectRollcallDate('${s.date}')" style="flex: none; width: 90px; text-align: center; padding: 8px 6px; border-radius: 10px; cursor: pointer; ${on ? 'background: var(--accent-soft); border: 1px solid var(--accent);' : 'background: var(--bg-panel-alt); border: 1px solid #eef2f7;'}">
              <div style="font-size: 11px; font-weight: 700; color: ${on ? 'var(--accent-hover)' : '#98a2b3'};">${s.wd} · ${s.date}</div>
              <div style="font-size: 13px; font-weight: 800; margin-top: 2px;">${Math.round((s.done / s.total) * 100)}%</div>
              <div style="font-size: 10px; color: ${s.locked ? '#98a2b3' : '#16a34a'}; font-weight: 600; margin-top: 1px;">${s.locked ? 'Đã khóa 24h' : 'Đang mở'}</div>
            </div>
          `;
        }).join('')}

        <!-- Body -->
        <div class="modal-body">
          ${isCheckin ? renderCheckinModalBody(o) :
            isProfile ? renderProfileModalBody(o) :
            isSummons ? renderSummonsModalBody(o) :
            isAlert ? renderAlertModalBody() : renderNewAlertModalBody()}
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button onclick="closeModal()" class="btn btn-secondary">Đóng</button>
          ${isCheckin ? `
            <button onclick="saveCheckin('${o.code}', 'absent')" class="btn btn-danger">Ghi Vắng mặt (-20đ)</button>
            <button onclick="saveCheckin('${o.code}', 'present')" class="btn btn-primary" ${!(state.uploadedFace && state.uploadedVeh) ? 'disabled' : ''}>Lưu · Xác nhận Có mặt</button>
          ` : isSummons ? `
            <button onclick="exportDoc('Giấy triệu tập ${o.name}')" class="btn btn-secondary">Xuất Word / PDF</button>
            <button onclick="saveSummons('${o.code}')" class="btn btn-primary">Ban hành Lệnh Triệu tập</button>
          ` : isAlert ? `
            <button onclick="resolveAlert()" class="btn btn-primary">Nộp Báo cáo Phản hồi (Đóng SLA)</button>
          ` : isNewAlert ? `
            <button onclick="broadcastAlert()" class="btn btn-danger pulse-danger">Phát Cảnh báo Ngay</button>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

// ==================== ACTIONS & EVENT HANDLERS ====================
function setRole(role) {
  state.role = role;
  state.screen = role === 'TINH' ? 'overview' : 'work';
  render();
}

function logout() {
  state.role = null;
  state.activeModal = null;
  render();
}

function navigate(screen) {
  state.screen = screen;
  state.activeModal = null;
  render();
}

function selectRollcallDate(date) {
  state.selectedDate = date;
  render();
}

function openCheckinModal(code) {
  state.selectedSubject = code;
  state.activeModal = 'checkin';
  state.uploadedFace = false;
  state.uploadedVeh = false;
  render();
}

function openProfileModal(code) {
  state.selectedSubject = code;
  state.activeModal = 'profile';
  render();
}

function openSummonsModal(code) {
  state.selectedSubject = code;
  state.activeModal = 'summons';
  render();
}

function openAlertModal(code) {
  state.activeModal = 'alert';
  render();
}

function openNewAlertModal() {
  state.activeModal = 'newAlert';
  render();
}

function closeModal() {
  state.activeModal = null;
  render();
}

function closeModalOnBackdrop(e) {
  if (e.target.classList.contains('modal-backdrop')) {
    closeModal();
  }
}

function toggleUpload(kind) {
  if (kind === 'face') state.uploadedFace = !state.uploadedFace;
  if (kind === 'veh') state.uploadedVeh = !state.uploadedVeh;
  render();
}

function saveCheckin(code, status) {
  const o = DB.objects.find(x => x.code === code);
  if (o) {
    o.roll = status;
    o.time = '23:15';
    if (status === 'absent') {
      o.score = Math.max(0, o.score - 20);
      showToast(`Đã ghi nhận ${o.name} VẮNG MẶT lúc 23:15 (-20đ). Tự động kích hoạt Cảnh báo đỏ đêm!`);
    } else {
      o.score = Math.min(100, o.score + 2);
      showToast(`Đã lưu ${o.name} CÓ MẶT lúc 23:15 (+2đ). Khóa cứng sau 24h.`);
    }
  }
  closeModal();
}

function saveSummons(code) {
  const o = DB.objects.find(x => x.code === code);
  showToast(`Đã ban hành Lệnh Triệu tập đối với ${o ? o.name : ''} kèm Đại diện Hộ gia đình.`);
  closeModal();
}

function resolveAlert() {
  showToast('Đã nộp Báo cáo Phản hồi Cảnh báo lên Công an Tỉnh trong hạn SLA. Trạng thái: ĐÃ XỬ LÝ (RESOLVED).');
  closeModal();
}

function broadcastAlert() {
  showToast('Đã phát Lệnh Cảnh báo Tác chiến Ca đêm tới 6 Xã/Phường. Bắt đầu đếm ngược SLA 60 phút.');
  closeModal();
}

function sendCommuneNudge(communeName) {
  showToast(`Đã bắn Cảnh báo Đôn đốc tác chiến đêm tới Trưởng Công an ${communeName}.`);
}

function approveProfile(code) {
  const o = DB.objects.find(x => x.code === code);
  if (o) o.state = 'active';
  showToast(`Lãnh đạo đã phê duyệt hồ sơ đối tượng ${o ? o.name : ''}. Phân công CSKV thụ lý.`);
  render();
}

function approveSessionClose() {
  showToast('Đã ký duyệt chốt sổ phiên điểm danh 28/08. Chuyển trạng thái KHÓA CỨNG 24H (Read-only).');
  render();
}

function saveAssignments() {
  showToast('Đã lưu và phê duyệt phân công Cán bộ CSKV thụ lý hồ sơ.');
}

function changeOfficer(code, officer) {
  const o = DB.objects.find(x => x.code === code);
  if (o) o.officer = officer;
  showToast(`Đã phân công ${o.name} cho ${officer}.`);
}

function verifyAuditChain() {
  showToast('Đã kiểm tra 1.284 khối mã băm SHA-256: 100% HỢP LỆ, không có dấu hiệu sửa lùi dữ liệu.');
}

function exportDoc(name) {
  showToast(`Đã kết xuất ${name} chuẩn thể thức CAND kèm vân mờ Forensic Watermark.`);
}

function wizardNext() {
  if (state.wizardStep < 3) {
    state.wizardStep++;
    render();
  } else {
    showToast('Đã nộp hồ sơ thanh niên hư mới trình Lãnh đạo Công an Xã phê duyệt.');
    state.wizardStep = 1;
    state.screen = 'profiles';
    render();
  }
}

function wizardPrev() {
  if (state.wizardStep > 1) {
    state.wizardStep--;
    render();
  }
}

function filterObjects(query) {
  // Reactive search demo
}

function attachEvents() {
  // DOM Ready
}

// Initial bootstrap
render();
</script>
