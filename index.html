    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.45;
    }
    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    button { cursor: pointer; border: none; background: none; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #E4E9EF; }
    ::-webkit-scrollbar-thumb { background: #B7C2CE; border-radius: 4px; }
    
    .font-mono { font-family: 'IBM Plex Mono', monospace; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 3px;
      white-space: nowrap;
      display: inline-block;
    }
    .btn-primary {
      background: var(--navy);
      color: #fff;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 3px;
      font-size: 12.8px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--red); }
    .btn-outline {
      border: 1px solid #CFD8E1;
      background: #fff;
      color: var(--navy);
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 3px;
      font-size: 12px;
      transition: all 0.15s;
    }
    .btn-outline:hover { border-color: var(--navy); background: #F8FAFC; }
    .btn-red {
      background: var(--red);
      color: #fff;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 3px;
      font-size: 12.8px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid #E7ECF1;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Grid Tables */
    .grid-table-header {
      background: #F4F7FA;
      border-bottom: 1px solid var(--border);
      padding: 9px 12px;
      font-size: 10.5px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      display: grid;
      gap: 8px;
      align-items: center;
    }
    .grid-table-row {
      border-bottom: 1px solid #F0F3F6;
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      align-items: center;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .grid-table-row:hover { background: #F6F9FC; }
    .grid-table-row.active { background: #F2F7FC; }

    @keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--red);
      animation: pulseRed 1.6s infinite;
      display: inline-block;
    }

    @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-box {
      animation: slideIn 0.25s ease-out;
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 999999;
      background: #0E2A47;
      color: #fff;
      padding: 13px 18px;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(10,27,46,.35);
      max-width: 440px;
      border-left: 4px solid #E8B647;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .toast-box.bad {
      background: #8E1620;
      border-left-color: #FFA4A9;
    }
  </style>
</head>

                    <div style="font-size:12.8px;font-weight:600;color:#16212E">01 đối tượng chưa có mặt theo lịch trình diện hôm nay</div>
                    <div style="font-size:11.8px;color:#6C7B8B;margin-top:2px">Trịnh Văn Sơn (HS-2025-00004) — Vắng quá 4 tiếng không có lý do</div>
                  </div>
                </div>
                <div style="display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #F0F3F6;align-items:flex-start">
                  <span style="width:4px;align-self:stretch;background:${AMBER};border-radius:2px;flex:none"></span>
                  <div style="flex:1">
                    <div style="font-size:12.8px;font-weight:600;color:#16212E">01 hồ sơ đủ 350 ngày cần thẩm tra an toàn trước khi xóa vết nhơ</div>
                    <div style="font-size:11.8px;color:#6C7B8B;margin-top:2px">Hoàng Anh Tú · CN-2026-00118 — hạn thẩm tra 30/08/2026</div>
                  </div>
                </div>
                <div style="display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #F0F3F6;align-items:flex-start">
                  <span style="width:4px;align-self:stretch;background:${RED};border-radius:2px;flex:none"></span>
                  <div style="flex:1">
                    <div style="font-size:12.8px;font-weight:600;color:#16212E">01 sự cố an ninh mức CRITICAL chưa xử lý</div>
                    <div style="font-size:11.8px;color:#6C7B8B;margin-top:2px">SEC-202608-00071 — tải hàng loạt ảnh chân dung, tài khoản đang bị khóa</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // =======================================================================
      // M01: DANH SÁCH HỒ SƠ & CHI TIẾT ĐỐI TƯỢNG
      // =======================================================================
      renderProfiles() {
        const a = this.acct();
        const s = this.state;
        const scoped = this.visibleProfiles();

        const rows = scoped.filter(p => {
          if (s.filter !== 'ALL' && p.st !== s.filter) return false;
          if (!s.q) return true;
          const q = s.q.toLowerCase();
          return p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || (p.vehicle || '').toLowerCase().includes(q);
        });

        const selP = rows.find(p => p.code === s.selCode) || rows[0] || scoped[0] || s.profiles[0] || null;

        const filters = [
          ['ALL', 'Tất cả'],
          ['ACTIVE_MANAGED', 'Đang quản lý'],
          ['SUBMITTED_CA', 'Chờ Trưởng CA'],
          ['SUBMITTED_UBND', 'Chờ UBND'],
          ['DRAFT', 'Nháp']
        ];

        return `
          <div>
            <!-- TOOLBAR: SEARCH, FILTERS, BUTTONS -->
            <div style="display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
              <input type="text" value="${s.q}" oninput="app.setState({ q: this.value })" placeholder="Tìm theo họ tên, mã hồ sơ, biển số xe…" style="flex:1;min-width:240px;padding:8px 12px;border:1px solid #CFD8E1;border-radius:3px;background:#fff;font-size:13px" />
              ${filters.map(([id, label]) => {
                const on = s.filter === id;
                return `
                  <button onclick="app.setState({ filter: '${id}' })" style="padding:7px 12px;border:1px solid ${on ? NAVY : '#CFD8E1'};background:${on ? NAVY : '#fff'};color:${on ? '#fff' : '#42505F'};border-radius:3px;font-size:12.3px;font-weight:600">${label}</button>
                `;
              }).join('')}
              ${this.can('profile.create') ? `
                <button onclick="app.setState({ screen: 'new' })" class="btn-red">+ Khởi tạo hồ sơ</button>
              ` : ''}
            </div>

            <div style="display:grid;grid-template-columns:1fr 380px;gap:12px;align-items:start">
              <!-- BẢNG DANH SÁCH HỒ SƠ (CSS GRID CỐT LÕI ĐÃ FIX) -->
              <div class="card">
                <div class="grid-table-header" style="grid-template-columns: 95px 1.2fr 95px 125px 110px 90px 105px;">
                  <div>Mã hồ sơ</div>
                  <div>Đối tượng</div>
                  <div>Địa bàn</div>
                  <div>Hành vi</div>
                  <div>Người giúp đỡ</div>
                  <div>Tiến độ</div>
                  <div>Trạng thái</div>
                </div>
                <div>
                  ${rows.map(p => {
                    const st = STATUS[p.st] || { l: p.st || '—', bg: '#EEF1F5', fg: '#5B6B7C' };
                    const isSel = selP && p.code === selP.code;
                    const pct = p.pct || 0;
                    const pctColor = pct >= 75 ? GREEN : pct >= 40 ? BLUE : '#93A2B1';
                    return `
                      <div onclick="app.setState({ selCode: '${p.code}' })" class="grid-table-row ${isSel ? 'active' : ''}" style="grid-template-columns: 95px 1.2fr 95px 125px 110px 90px 105px;">
                        <div class="font-mono" style="font-size:11.5px;color:#0E2A47;font-weight:600">${p.code}</div>
                        <div style="min-width:0">
                          <div style="font-weight:600;color:#16212E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
                          <div style="font-size:11px;color:#8B98A6;margin-top:1px">${p.sub}</div>
                        </div>
                        <div style="color:#42505F;font-size:12px">${p.hamlet}</div>
                        <div style="color:#42505F;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.viol}</div>
                        <div style="color:#42505F;font-size:12px">${p.mentor}</div>
                        <div>
                          <div style="height:6px;background:#EDF1F5;border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pctColor}"></div></div>
                          <div class="font-mono" style="font-size:10.5px;color:#8B98A6;margin-top:3px">${pct}%</div>
                        </div>
                        <div><span class="badge" style="background:${st.bg};color:${st.fg}">${st.l}</span></div>
                      </div>
                    `;
                  }).join('')}
                </div>
                <div style="padding:10px 13px;font-size:11.5px;color:#8B98A6;border-top:1px solid #EDF1F5">
                  Hiển thị ${rows.length}/${scoped.length} hồ sơ thuộc phạm vi ${a.scopeText} (toàn hệ thống: ${s.profiles.length})
                </div>
              </div>

              <!-- THẺ CHI TIẾT HỒ SƠ BÊN PHẢI -->
              ${selP ? this.renderProfileDetail(selP) : '<div class="card" style="padding:20px;text-align:center;color:#8B98A6">Không có hồ sơ</div>'}
            </div>
          </div>
        `;
      }

      renderProfileDetail(p) {
        const a = this.acct();
        const acts = [];

        if (this.can('profile.submit') && (p.st === 'DRAFT' || p.st === 'NEED_UPDATE')) {
          acts.push(`
            <button onclick="app.submitProfileForApproval('${p.code}')" class="btn-primary" style="width:100%;text-align:left">Trình Trưởng Công an xã duyệt</button>
          `);
        }
        if (this.can('profile.approve') && p.st === 'SUBMITTED_CA') {
          acts.push(`
            <button onclick="app.approveProfileToUbnd('${p.code}')" class="btn-primary" style="width:100%;text-align:left">Ký tờ trình & chuyển UBND xã</button>
            <button onclick="app.requestProfileUpdate('${p.code}')" class="btn-outline" style="width:100%;text-align:left">Yêu cầu bổ sung hồ sơ</button>
          `);
        }
        if (this.can('profile.issue') && p.st === 'SUBMITTED_UBND') {
          acts.push(`
            <button onclick="app.issueProfileDecision('${p.code}')" class="btn-primary" style="width:100%;text-align:left">Ký số ban hành quyết định</button>
            <button onclick="app.rejectProfile('${p.code}')" class="btn-outline" style="width:100%;text-align:left">Bác bỏ đề nghị</button>
          `);
        }
        if (!acts.length) {
          acts.push(`
            <button onclick="app.viewProfileLog('${p.code}')" class="btn-outline" style="width:100%;text-align:left">Xem hồ sơ (chỉ đọc)</button>
          `);
        }

        const facts = [
          ['Ngày sinh', p.dob],
          ['Nhóm tuổi', p.group],
          ['Hành vi vi phạm', p.viol],
          ['Diện cư trú', p.res],
          ['Thời hạn áp dụng', p.dur],
          ['Người giúp đỡ', p.mentor],
          ['Xếp loại gần nhất', p.rating],
          ['Giám hộ', p.guardian],
          ['Phương tiện', p.vehicle]
        ];

        return `
          <div class="card" style="position:sticky;top:80px">
            <div style="padding:14px 15px;background:#0E2A47;color:#fff">
              <div class="font-mono" style="font-size:11px;color:#9FB6CD">${p.code}</div>
              <div style="font-size:16px;font-weight:700;margin-top:3px">${p.name}</div>
              <div style="font-size:11.5px;color:#A9BCD0;margin-top:2px">${p.sub} · ${p.hamlet}</div>
            </div>

            <!-- CHÂN DUNG CÓ WATERMARK AN NINH PII -->
            <div style="position:relative;height:112px;background:repeating-linear-gradient(45deg,#E9EEF3,#E9EEF3 8px,#E2E9F0 8px,#E2E9F0 16px);display:flex;align-items:center;justify-content:center;border-bottom:1px solid #E7ECF1;overflow:hidden">
              <span class="font-mono" style="font-size:11px;color:#7E8C9B">ảnh chân dung · 02 ảnh bắt buộc</span>
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
                <div class="font-mono" style="transform:rotate(-18deg);font-size:10px;color:rgba(14,42,71,.25);text-align:center;line-height:1.5">${a.name} · ${p.code}<br>28/08/2026 · BẢO MẬT PII</div>
              </div>
            </div>

            <!-- FACTS -->
            <div style="padding:13px 15px;border-bottom:1px solid #EDF1F5">
              ${facts.map(([k, v]) => `
                <div style="display:flex;justify-content:space-between;gap:12px;padding:4.5px 0;font-size:12.3px">
                  <span style="color:#6C7B8B">${k}</span>
                  <span style="color:#16212E;font-weight:600;text-align:right">${v || '—'}</span>
                </div>
              `).join('')}
            </div>

            <!-- TÀI LIỆU BẮT BUỘC BR-M01-05 -->
            <div style="padding:13px 15px;border-bottom:1px solid #EDF1F5">
              <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6C7B8B;font-weight:600;margin-bottom:8px">Tài liệu bắt buộc (BR-M01-05)</div>
              ${DOC_LABELS.map((l, i) => {
                const ok = i < (p.docsOk || 0);
                return `
                  <div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.2px">
                    <span style="width:15px;height:15px;border-radius:2px;background:${ok ? GREEN : AMBER};color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;flex:none">${ok ? '✓' : '!'}</span>
                    <span style="color:#42505F;flex:1">${l}</span>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- THAO TÁC THEO RBAC -->
            <div style="padding:13px 15px">
              <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6C7B8B;font-weight:600;margin-bottom:9px">Thao tác khả dụng với tài khoản của bạn</div>
              <div style="display:flex;flex-direction:column;gap:7px">
                ${acts.join('')}
              </div>
              <div style="margin-top:10px;font-size:11.3px;color:#8B98A6;line-height:1.55">Nút thao tác được sinh tự động theo quyền của tài khoản ${a.username} và trạng thái hồ sơ.</div>
            </div>

            <!-- LỊCH SỬ XỬ LÝ -->
            <div style="padding:12px 15px;border-top:1px solid #EDF1F5;background:#F8FAFC">
              <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6C7B8B;font-weight:600;margin-bottom:7px">Lịch sử xử lý hồ sơ</div>
              ${(p.history || []).slice(0, 4).map(h => `
                <div style="display:flex;gap:9px;padding:3.5px 0;font-size:11.6px;line-height:1.45">
                  <span class="font-mono" style="color:#8B98A6;flex:none">${h.time}</span>
                  <span style="color:#42505F">${h.text}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      submitProfileForApproval(code) {
        const p = this.state.profiles.find(x => x.code === code);
        if (p) {
          if ((p.docsOk || 0) < 5) {
            this.flash('Thiếu ' + (5 - (p.docsOk || 0)) + ' tài liệu bắt buộc (BR-M01-05) — chưa thể trình duyệt.', true);
            return;
          }
          this.patchProfile(code, { st: 'SUBMITTED_CA' }, this.acct().name + ' trình Trưởng Công an xã');
          this.log('SUBMIT', code, 'Trình duyệt hồ sơ');
          this.flash(p.name + ': hồ sơ chuyển trạng thái "Chờ Trưởng CA".');
        }
      }

      approveProfileToUbnd(code) {
        const p = this.state.profiles.find(x => x.code === code);
        if (p) {
          this.patchProfile(code, { st: 'SUBMITTED_UBND' }, this.acct().name + ' ký tờ trình, chuyển UBND xã');
          this.log('APPROVE', code, 'Ký tờ trình chuyển UBND');
          this.flash(p.name + ': đã chuyển Chủ tịch UBND xã ký ban hành.');
        }
      }

      requestProfileUpdate(code) {
        const p = this.state.profiles.find(x => x.code === code);
        if (p) {
          this.patchProfile(code, { st: 'NEED_UPDATE' }, this.acct().name + ' yêu cầu bổ sung hồ sơ');
          this.log('REQUEST_UPDATE', code, 'Yêu cầu bổ sung');
          this.flash(p.name + ': đã trả hồ sơ về CSKV để bổ sung.', true);
        }
      }

      issueProfileDecision(code) {
        const p = this.state.profiles.find(x => x.code === code);
        if (p) {
          this.patchProfile(code, { st: 'ACTIVE_MANAGED', pct: 2, dur: '6 tháng (28/08/2026 – 28/02/2027)' }, this.acct().name + ' ký ban hành quyết định áp dụng');
          this.log('ISSUE_DECISION', code, 'Ký số ban hành quyết định');
          this.flash(p.name + ': quyết định đã ban hành, chuyển sang bước phân công người giúp đỡ.');
        }
      }

      rejectProfile(code) {
        const p = this.state.profiles.find(x => x.code === code);
        if (p) {
          this.patchProfile(code, { st: 'REJECTED' }, this.acct().name + ' bác bỏ đề nghị');
          this.log('REJECT', code, 'Bác bỏ đề nghị');
          this.flash(p.name + ': đề nghị đã bị bác bỏ.', true);
        }
      }

      viewProfileLog(code) {
        this.log('VIEW_PROFILE', code, 'Xem chi tiết hồ sơ');
        this.flash('Đã ghi vết thao tác xem hồ sơ ' + code + '.');
      }

      // =======================================================================
      // M01: FORM KHỞI TẠO HỒ SƠ MỚI
      // =======================================================================
      renderNew() {
        const s = this.state;
        const c = this.calc();
        const a = this.acct();
        const hamlets = a.hamlets || HAMLETS;

        const blocked = c.expired;
        const verdict = blocked
          ? { title: 'Chặn trình duyệt — hết thời hiệu', text: 'Quá hạn ' + Math.abs(c.days) + ' ngày so với hạn chót ' + fmt(c.exp) + '. Hồ sơ sẽ lưu ở trạng thái EXPIRED_STATUTE.', bg: '#FDF0F1', bd: '#F0BFC3', fg: '#96101B' }
          : c.days <= 30
            ? { title: 'Cảnh báo — sắp hết thời hiệu', text: 'Còn ' + c.days + ' ngày trước hạn chót ' + fmt(c.exp) + '. Cần trình duyệt sớm.', bg: '#FDF8EC', bd: '#E5D3AC', fg: '#7A5B14' }
            : { title: 'Đủ điều kiện lập hồ sơ', text: 'Còn ' + c.days + ' ngày thời hiệu. ' + (s.fDocs.length === 5 ? 'Đã đủ 05 tài liệu bắt buộc.' : 'Còn thiếu ' + (5 - s.fDocs.length) + ' tài liệu bắt buộc.'), bg: '#EDF7F1', bd: '#BFE0CD', fg: '#14663C' };

        return `
          <div style="display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start">
            <div class="card">
              <div style="padding:16px 18px">
                <div style="font-size:11.5px;font-weight:700;color:#0E2A47;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px">Nhân thân, cư trú, phương tiện &amp; vi phạm</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:13px 16px">
                  <div>
                    <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Họ và tên đối tượng <span style="color:#C1121F">*</span></label>
                    <input type="text" value="${s.fName}" oninput="app.setState({ fName: this.value.toUpperCase() })" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px;text-transform:uppercase" />
                  </div>
                  <div>
                    <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Ngày sinh <span style="color:#C1121F">*</span></label>
                    <input type="date" value="${s.fDob}" onchange="app.setState({ fDob: this.value })" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px" />
                  </div>
                  <div>
                    <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Ngày vi phạm lần cuối <span style="color:#C1121F">*</span></label>
                    <input type="date" value="${s.fViolDate}" onchange="app.setState({ fViolDate: this.value })" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px" />
                  </div>
                  <div>
                    <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Hành vi vi phạm chính <span style="color:#C1121F">*</span></label>
                    <select onchange="app.setState({ fViolType: this.value })" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px;background:#fff">
                      ${VIOLS.map(v => `<option value="${v.id}" ${s.fViolType === v.id ? 'selected' : ''}>${v.label}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Số ngày ở thực tế tại địa bàn <span style="color:#C1121F">*</span></label>
                    <input type="number" value="${s.fDays}" oninput="app.setState({ fDays: this.value })" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px" />
                    <div style="font-size:10.8px;color:#8B98A6;margin-top:4px">&lt; 30 ngày → phân luồng quản lý lưu động (BR-M01-03)</div>
                  </div>
                  <div>
                    <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Địa bàn thôn/ấp <span style="color:#C1121F">*</span></label>
                    <select onchange="app.setState({ fHamlet: this.value })" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px;background:#fff">
                      ${hamlets.map(h => `<option value="${h}" ${s.fHamlet === h ? 'selected' : ''}>${h}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Họ tên cha/mẹ/người giám hộ <span style="color:#C1121F">*</span></label>
                    <input type="text" value="${s.fGuardian}" oninput="app.setState({ fGuardian: this.value })" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px" />
                  </div>
                  <div>
                    <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Số điện thoại giám hộ <span style="color:#C1121F">*</span></label>
                    <input type="text" value="${s.fPhone}" oninput="app.setState({ fPhone: this.value })" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px" />
                  </div>
                  <div style="grid-column:1/-1">
                    <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Phương tiện di chuyển &amp; Biển số xe (nếu có)</label>
                    <input type="text" value="${s.fVehicle}" oninput="app.setState({ fVehicle: this.value })" placeholder="VD: 59X1-482.19 · Yamaha Exciter (độ pô) hoặc Đi bộ / Xe đạp" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px" />
                  </div>
                </div>

                <div style="margin-top:18px;padding-top:15px;border-top:1px solid #EDF1F5">
                  <div style="font-size:11.5px;font-weight:700;color:#0E2A47;letter-spacing:.05em;text-transform:uppercase;margin-bottom:11px">Tài liệu bắt buộc — tích để xác nhận đã đính kèm</div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    ${DOC_LABELS.map((l, i) => {
                      const on = s.fDocs.includes(i);
                      return `
                        <button onclick="app.toggleDoc(${i})" style="display:flex;align-items:center;gap:9px;text-align:left;padding:9px 11px;border-radius:3px;border:1px solid ${on ? '#BFE0CD' : '#CFD8E1'};background:${on ? '#F3FAF6' : '#fff'}">
                          <span style="width:16px;height:16px;border-radius:2px;background:${on ? GREEN : '#C3CEDA'};color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;flex:none">${on ? '✓' : ''}</span>
                          <span style="font-size:12.2px;color:#42505F;flex:1">${l}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            </div>

            <!-- CỘT KẾT QUẢ TÍNH TOÁN & SUBMIT -->
            <div style="position:sticky;top:80px;display:flex;flex-direction:column;gap:12px">
              <div class="card">
                <div style="padding:11px 14px;background:#F4F7FA;border-bottom:1px solid #E7ECF1;font-size:12px;font-weight:700;color:#0E2A47">Kết quả phân loại tự động</div>
                <div style="padding:13px 14px">
                  <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.4px;border-bottom:1px solid #F4F7FA"><span style="color:#6C7B8B">Tuổi tại ngày vi phạm</span><span style="font-weight:700;color:#0E2A47">${c.age} tuổi</span></div>
                  <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.4px;border-bottom:1px solid #F4F7FA"><span style="color:#6C7B8B">Nhóm phân loại</span><span style="font-weight:700;color:${c.gcolor}">${c.group}</span></div>
                  <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.4px;border-bottom:1px solid #F4F7FA"><span style="color:#6C7B8B">Thời hiệu luật định</span><span style="font-weight:700;color:#0E2A47">${c.months} tháng</span></div>
                  <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.4px;border-bottom:1px solid #F4F7FA"><span style="color:#6C7B8B">Hạn chót thời hiệu</span><span style="font-weight:700;color:${c.expired ? RED : NAVY}">${fmt(c.exp)}</span></div>
                  <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.4px;border-bottom:1px solid #F4F7FA"><span style="color:#6C7B8B">Diện quản lý</span><span style="font-weight:700;color:${c.mobile ? AMBER : GREEN}">${c.mobile ? 'Lưu động (<30 ngày)' : 'Cư trú ổn định'}</span></div>
                  <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.4px"><span style="color:#6C7B8B">Tài liệu đã đính kèm</span><span style="font-weight:700;color:${s.fDocs.length === 5 ? GREEN : AMBER}">${s.fDocs.length}/5</span></div>
                </div>
              </div>

              <div style="background:${verdict.bg};border:1px solid ${verdict.bd};border-radius:4px;padding:13px 14px">
                <div style="font-size:12.5px;font-weight:700;color:${verdict.fg};margin-bottom:5px">${verdict.title}</div>
                <div style="font-size:12px;color:${verdict.fg};line-height:1.55">${verdict.text}</div>
              </div>

              <button onclick="app.doCreateProfile()" class="btn-primary" style="padding:12px;font-size:13.2px;background:${blocked ? '#8E1620' : NAVY}">
                ${blocked ? 'Lưu hồ sơ ở trạng thái hết thời hiệu' : 'Lưu & trình Trưởng Công an xã'}
              </button>
            </div>
          </div>
        `;
      }

      toggleDoc(index) {
        const list = this.state.fDocs;
        if (list.includes(index)) {
          this.state.fDocs = list.filter(x => x !== index);
        } else {
          this.state.fDocs = list.concat(index);
        }
        this.render();
      }

      doCreateProfile() {
        const s = this.state;
        const a = this.acct();
        const c = this.calc();
        if (!s.fName.trim()) {
          this.flash('Chưa nhập họ tên đối tượng.', true);
          return;
        }
        const code = 'HS-2026-' + d2(s.seq).padStart(5, '0');
        const blocked = c.expired;
        const st = blocked ? 'EXPIRED_STATUTE' : (s.fDocs.length === 5 ? 'SUBMITTED_CA' : 'DRAFT');
        const vObj = VIOLS.find(v => v.id === s.fViolType) || VIOLS[0];

        const p = {
          code,
          name: s.fName.toUpperCase(),
          dob: fmt(new Date(s.fDob)),
          group: c.group,
          viol: vObj.label,
          mentor: '— chưa phân công',
          st,
          pct: 0,
          hamlet: s.fHamlet,
          sub: 'Nam · ' + c.age + ' tuổi',
          dur: c.age < 18 ? 'Đề xuất 3 – 6 tháng' : 'Đề xuất 6 – 12 tháng',
          guardian: (s.fGuardian || 'Chưa nhập') + (s.fPhone ? ' · ' + s.fPhone : ''),
          vehicle: s.fVehicle || 'Chưa ghi nhận',
          res: c.mobile ? 'Lưu động · ' + s.fDays + ' ngày' : 'Cư trú ổn định · ' + s.fDays + ' ngày',
          docsOk: s.fDocs.length,
          rating: '—',
          history: [{ time: this.histLine(), text: a.name + ' khởi tạo hồ sơ' }]
        };

        this.state.profiles.unshift(p);
        this.state.seq++;
        this.state.screen = 'profiles';
        this.state.selCode = code;
        this.state.fName = '';
        this.state.fGuardian = '';
        this.state.fPhone = '';
        this.log('CREATE', code, 'Khởi tạo hồ sơ mới');
        this.flash(blocked ? code + ' đã lưu ở trạng thái EXPIRED_STATUTE.' : (st === 'SUBMITTED_CA' ? code + ' đã tạo và trình Trưởng Công an xã duyệt.' : code + ' đã lưu nháp — cần bổ sung đủ 05 tài liệu.'), blocked);
      }

      // =======================================================================
      // M02: PHÂN CÔNG NGƯỜI GIÚP ĐỠ & QUYẾT TOÁN 500K
      // =======================================================================
      renderAssign() {
        const s = this.state;
        const a = this.acct();
        const scoped = this.visibleProfiles();
        const waitList = scoped.filter(p => p.mentor.indexOf('chưa') >= 0 || p.mentor === '—');
        const pm = s.mentors.find(m => m.id === s.mentorId) || s.mentors[0];
        const full = pm.cases >= 3;

        const paid = s.vouchers.filter(v => v.st === 'PAID').reduce((n, v) => n + v.amount, 0);
        const totalOk = s.vouchers.filter(v => v.st !== 'LOCKED').reduce((n, v) => n + v.amount, 0);

        return `
          <div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;align-items:start">
              <!-- DANH BẠ NGƯỜI GIÚP ĐỠ -->
              <div class="card">
                <div class="card-header">
                  <span>Danh bạ người giúp đỡ</span>
                  <span style="font-size:11px;color:#8B98A6">Định mức tối đa 03 ca/người</span>
                </div>
                ${s.mentors.map(m => {
                  const ini = m.name.split(' ').slice(-2).map(w => w[0]).join('');
                  const isSel = s.mentorId === m.id;
                  const isBusy = m.cases >= 3;
                  const loadColor = isBusy ? RED : m.cases === 2 ? AMBER : GREEN;
                  return `
                    <button onclick="app.setState({ mentorId: '${m.id}' })" style="width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:11px 15px;border-bottom:1px solid #F0F3F6;background:${isSel ? '#F2F7FC' : '#fff'}">
                      <span style="width:32px;height:32px;border-radius:50%;background:#E7EEF6;color:#0E2A47;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">${ini}</span>
                      <span style="flex:1;min-width:0">
                        <span style="display:block;font-size:12.8px;font-weight:600;color:#16212E">${m.name}</span>
                        <span style="display:block;font-size:11.3px;color:#6C7B8B">${m.org} · ${m.phone}</span>
                      </span>
                      <span style="text-align:right;flex:none">
                        <span style="display:block;font-size:11px;font-weight:700;color:${loadColor}">${m.cases}/3 ca</span>
                        <span style="display:block;width:56px;height:5px;background:#EDF1F5;border-radius:3px;margin-top:4px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(m.cases / 3 * 100)}%;background:${loadColor}"></span></span>
                      </span>
                      <span class="badge" style="background:${isBusy ? '#FDECEE' : '#E7F4EC'};color:${isBusy ? '#96101B' : '#14663C'};flex:none">${isBusy ? 'BUSY_FULL' : 'AVAILABLE'}</span>
                    </button>
                  `;
                }).join('')}
              </div>

              <!-- FORM PHÂN CÔNG KÈM CẶP -->
              <div class="card">
                <div class="card-header">Phân công kèm cặp</div>
                <div style="padding:14px 15px">
                  <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Đối tượng đang chờ phân công</label>
                  <select onchange="app.setState({ assignProfile: this.value })" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:13px;background:#fff;margin-bottom:12px">
                    ${waitList.length ? waitList.map(p => `<option value="${p.code}">${p.code} · ${p.name} · ${p.viol}</option>`).join('') : '<option value="">Không có đối tượng chờ phân công trong phạm vi</option>'}
                  </select>

                  <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Người giúp đỡ được chọn</label>
                  <div style="padding:10px 12px;border:1px solid ${full ? '#F0BFC3' : '#BFE0CD'};background:${full ? '#FDF0F1' : '#EDF7F1'};border-radius:3px;margin-bottom:6px">
                    <div style="font-size:13px;font-weight:600;color:#16212E">${pm.name}</div>
                    <div style="font-size:11.5px;color:#6C7B8B;margin-top:2px">${pm.org} · ${pm.phone} · đang phụ trách ${pm.cases}/3 ca</div>
                  </div>
                  <div style="font-size:11.5px;color:${full ? '#96101B' : '#5B6B7C'};line-height:1.5;margin-bottom:12px">
                    ${full ? 'Đã đạt định mức tối đa 03 ca — hệ thống sẽ chặn khi bấm phân công (BR-M02-01).' : 'Đủ điều kiện tiếp nhận. Sau khi duyệt, người giúp đỡ có 24 giờ xác nhận.'}
                  </div>

                  <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:6px">Nhiệm vụ trọng tâm</label>
                  <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px">
                    ${TASKS.map(tk => {
                      const on = s.tasks.includes(tk.id);
                      return `
                        <button onclick="app.toggleTask('${tk.id}')" style="padding:6px 11px;border-radius:14px;font-size:11.8px;font-weight:600;border:1px solid ${on ? NAVY : '#CFD8E1'};background:${on ? '#E7EEF6' : '#fff'};color:${on ? NAVY : '#5B6B7C'}">${tk.label}</button>
                      `;
                    }).join('')}
                  </div>

                  <button onclick="app.doAssignMentor()" class="btn-primary" style="width:100%;padding:11px">
                    ${this.can('assign.approve') ? 'Phê duyệt phân công' : (this.can('assign.propose') ? 'Đề xuất phân công' : 'Không có quyền phân công')}
                  </button>
                  <div style="font-size:11.3px;color:#8B98A6;margin-top:8px;line-height:1.55">Mốc tính kinh phí 500.000đ/tháng bắt đầu từ ngày người giúp đỡ xác nhận tiếp nhận.</div>
                </div>
              </div>
            </div>

            <!-- BẢNG QUYẾT TOÁN KINH PHÍ 500K CÓ HARD-STOP -->
            <div class="card">
              <div class="card-header">
                <div>Quyết toán kinh phí hỗ trợ 500.000đ/tháng · kỳ 08/2026</div>
                <div style="font-size:11.5px;color:#8B98A6">Điều kiện xuất phiếu chi: tối thiểu 02 lượt ghi sổ tay/tháng (Cơ chế Khóa cứng Hard-stop)</div>
              </div>
              <div class="grid-table-header" style="grid-template-columns: 120px 1.2fr 90px 80px 100px 120px 110px;">
                <div>Mã phiếu chi</div>
                <div>Người nhận</div>
                <div>Ca kèm cặp</div>
                <div>Sổ tay/tháng</div>
                <div style="text-align:right">Số tiền</div>
                <div>Trạng thái</div>
                <div style="text-align:right">Thao tác</div>
              </div>
              <div>
                ${s.vouchers.map(v => {
                  const m = s.mentors.find(x => x.id === v.mid);
                  const locked = v.st === 'LOCKED';
                  const canReview = this.can('voucher.review') && v.st === 'PENDING_REVIEW';
                  const canPay = this.can('voucher.pay') && v.st === 'CHIEF_APPROVED';
                  const actv = canReview || canPay;
                  const vstMap = {
                    PENDING_REVIEW: { l: 'Chờ thẩm định', bg: '#FDF3E2', fg: '#8A5A08' },
                    CHIEF_APPROVED: { l: 'Trưởng CA đã duyệt', bg: '#E9F0FA', fg: '#1D4E8F' },
                    PAID: { l: 'Đã chi trả', bg: '#E7F4EC', fg: '#14663C' },
                    LOCKED: { l: 'Hard-stop: thiếu sổ tay', bg: '#FDECEE', fg: '#96101B' }
                  };
                  const stObj = vstMap[v.st];
                  return `
                    <div class="grid-table-row" style="grid-template-columns: 120px 1.2fr 90px 80px 100px 120px 110px;background:${locked ? '#FEF7F8' : '#fff'}">
                      <div class="font-mono" style="font-size:11.5px;color:#0E2A47;font-weight:600">${v.code}</div>
                      <div>
                        <span style="font-weight:600;color:#16212E">${m.name}</span>
                        <span style="display:block;font-size:11px;color:#8B98A6">${m.bank}</span>
                      </div>
                      <div style="color:#42505F">${v.cases}</div>
                      <div><span style="font-weight:700;color:${m.logs >= 2 ? GREEN : RED}">${m.logs} lượt</span></div>
                      <div class="font-mono" style="text-align:right;font-weight:600;color:${locked ? RED : '#16212E'}">${locked ? 'Bị khóa' : money(v.amount)}</div>
                      <div><span class="badge" style="background:${stObj.bg};color:${stObj.fg}">${stObj.l}</span></div>
                      <div style="text-align:right">
                        <button onclick="app.handleVoucher('${v.code}')" style="padding:6px 10px;border-radius:3px;font-size:11.5px;font-weight:600;border:1px solid ${actv ? NAVY : '#CFD8E1'};background:${actv ? NAVY : '#fff'};color:${actv ? '#fff' : '#5B6B7C'}">
                          ${locked ? 'Không xuất phiếu' : (canPay ? 'Ký duyệt chi' : (canReview ? 'Thẩm định' : 'Xem phiếu'))}
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
              <div style="padding:11px 14px;border-top:1px solid #EDF1F5;display:flex;justify-content:space-between;font-size:12.3px">
                <span style="color:#6C7B8B">${s.vouchers.length} phiếu chi kỳ 08/2026 · ${s.vouchers.filter(v => v.st === 'LOCKED').length} phiếu bị khóa do thiếu sổ tay</span>
                <span class="font-mono" style="font-weight:700;color:#0E2A47">Đã chi: ${money(paid)} / hợp lệ ${money(totalOk)}</span>
              </div>
            </div>
          </div>
        `;
      }

      toggleTask(id) {
        const list = this.state.tasks;
        if (list.includes(id)) {
          this.state.tasks = list.filter(x => x !== id);
        } else {
          this.state.tasks = list.concat(id);
        }
        this.render();
      }

      doAssignMentor() {
        const s = this.state;
        const a = this.acct();
        const canAssign = this.can('assign.propose') || this.can('assign.approve');
        if (!canAssign) {
          this.flash('Tài khoản của bạn không có quyền phân công người giúp đỡ.', true);
          return;
        }
        const scoped = this.visibleProfiles();
        const waitList = scoped.filter(p => p.mentor.indexOf('chưa') >= 0 || p.mentor === '—');
        const assignTarget = waitList.find(p => p.code === s.assignProfile) || waitList[0];
        if (!assignTarget) {
          this.flash('Không còn đối tượng chờ phân công trong phạm vi.', true);
          return;
        }
        const pm = s.mentors.find(m => m.id === s.mentorId) || s.mentors[0];
        if (pm.cases >= 3) {
          this.flash(pm.name + ' đã đủ định mức 03 ca (BR-M02-01) — không thể phân công thêm.', true);
          return;
        }
        const approve = this.can('assign.approve');
        pm.cases++;
        this.patchProfile(assignTarget.code, { mentor: approve ? pm.name : pm.name + ' (chờ duyệt)' }, a.name + (approve ? ' phê duyệt' : ' đề xuất') + ' phân công ' + pm.name);
        this.log(approve ? 'ASSIGN_APPROVE' : 'ASSIGN_PROPOSE', assignTarget.code, 'Người giúp đỡ: ' + pm.name);
        this.flash(assignTarget.name + ' → ' + pm.name + (approve ? ': đã phê duyệt phân công thành công.' : ': đã gửi đề xuất lên Trưởng Công an xã.'));
      }

      handleVoucher(code) {
        const v = this.state.vouchers.find(x => x.code === code);
        const a = this.acct();
        if (!v) return;
        const m = this.state.mentors.find(x => x.id === v.mid);

        if (v.st === 'LOCKED') {
          this.flash('Hard-stop: ' + m.name + ' chỉ ghi ' + m.logs + '/2 lượt sổ tay trong tháng — hệ thống không xuất phiếu chi.', true);
          return;
        }
        if (this.can('voucher.review') && v.st === 'PENDING_REVIEW') {
          v.st = 'CHIEF_APPROVED';
          this.log('VOUCHER_REVIEW', v.code, 'Thẩm định phiếu chi ' + m.name);
          this.flash(v.code + ': đã thẩm định, chuyển Chủ tịch UBND xã ký duyệt chi.');
          this.render();
          return;
        }
        if (this.can('voucher.pay') && v.st === 'CHIEF_APPROVED') {
          v.st = 'PAID';
          this.log('VOUCHER_PAY', v.code, 'Ký duyệt chi ' + money(v.amount));
          this.flash(v.code + ': đã ký duyệt chi ' + money(v.amount) + ' cho ' + m.name + '.');
          this.render();
          return;
        }
        this.log('VIEW_VOUCHER', v.code, 'Xem phiếu chi');
        this.flash('Tài khoản của bạn chỉ có quyền xem phiếu chi này.');
      }

      // =======================================================================
      // M03: TRÌNH DIỆN TẠI CA XÃ & SỔ TAY SỐ MOBILE
      // =======================================================================
      renderCheckin() {
        const s = this.state;
        const a = this.acct();
        const curAp = s.appts.find(x => x.id === s.checkinId) || s.appts[0];
        const canRecord = this.can('checkin.record');

        const apStyle = {
          DONE: { l: 'Đã có mặt', bg: '#E7F4EC', fg: '#14663C' },
          WAITING: { l: 'Đang chờ', bg: '#FDF3E2', fg: '#8A5A08' },
          PENDING: { l: 'Chưa đến hạn', bg: '#EEF1F5', fg: '#5B6B7C' },
          ABSENT: { l: 'Vắng — báo động', bg: '#FDECEE', fg: '#96101B' }
        };

        return `
          <div style="display:grid;grid-template-columns:1fr 400px;gap:12px;align-items:start">
            <div style="display:flex;flex-direction:column;gap:12px">
              <!-- LỊCH TRÌNH DIỆN HÔM NAY -->
              <div class="card">
                <div class="card-header">
                  <span>Lịch trình diện tại Công an xã · 28/08/2026</span>
                  <span style="font-size:11.5px;color:#8B98A6">Quá 4 tiếng chưa có mặt → cảnh báo đỏ &amp; SMS gia đình</span>
                </div>
                ${s.appts.map(ap => {
                  const isSel = s.checkinId === ap.id;
                  const st = apStyle[ap.st];
                  return `
                    <div style="display:flex;align-items:center;gap:13px;padding:11px 15px;border-bottom:1px solid #F0F3F6;background:${isSel ? '#F2F7FC' : (ap.st === 'ABSENT' ? '#FEF7F8' : '#fff')}">
                      <span class="font-mono" style="font-size:12.5px;font-weight:600;color:#0E2A47;width:44px;flex:none">${ap.time}</span>
                      <span style="flex:1;min-width:0">
                        <span style="display:block;font-size:13px;font-weight:600;color:#16212E">${ap.name}</span>
                        <span style="display:block;font-size:11.3px;color:#6C7B8B">${ap.code} · ${ap.note}</span>
                      </span>
                      <span class="badge" style="background:${st.bg};color:${st.fg};flex:none">${ap.st === 'DONE' ? st.l + ' ' + ap.doneAt : st.l}</span>

      setCheckinField(field, val) {
        this.state.checkin[field] = val;
        this.render();
      }

      doSaveCheckin() {
        const s = this.state;
        const a = this.acct();
        if (!this.can('checkin.record')) {
          this.flash('Chỉ Cán bộ CSKV được ghi nhận trình diện tại trụ sở.', true);
          return;
        }
        if (s.counsel.trim().length < 20) {
          this.flash('Nội dung răn đe phải tối thiểu 20 ký tự.', true);
          return;
        }
        const curAp = s.appts.find(x => x.id === s.checkinId) || s.appts[0];
        const now = new Date();
        const at = d2(now.getHours()) + ':' + d2(now.getMinutes());

        curAp.st = s.checkin.attendance === 'MISSED_UNEXCUSED' ? 'ABSENT' : 'DONE';
        curAp.doneAt = at;

        const isPositive = s.checkin.drug === 'POSITIVE';
        this.log('CHECKIN', curAp.code, 'Trình diện: ' + (isPositive ? 'test MT dương tính' : 'test MT âm tính'));
        this.flash(isPositive
          ? curAp.name + ': đã lưu — BÁO ĐỘNG ĐỎ, hệ thống đề xuất họp đột xuất và thông báo Trưởng CA.'
          : curAp.name + ': đã lưu kết quả trình diện lúc ' + at + ', chuỗi ngày chấp hành tốt +7.', isPositive);
      }

      // =======================================================================
      // M04: HỌP ĐÁNH GIÁ XẾP LOẠI & ĐIỂM DANH QUORUM
      // =======================================================================
      renderMeeting() {
        const s = this.state;
        const a = this.acct();
        const presentCount = Object.values(s.present).filter(Boolean).length;
        const qp = Math.round(presentCount / ATTENDEES.length * 100);
        const quorumOk = qp >= 66.7;
        const canChair = this.can('meeting.chair');

        const RAT = [
          ['EXCELLENT', 'Xuất sắc'],
          ['PROGRESSIVE', 'Có tiến bộ'],
          ['NO_PROGRESS', 'Chưa tiến bộ'],
          ['UNCOOPERATIVE', 'Không hợp tác']
        ];
        const RATVI = { EXCELLENT: 'Xuất sắc', PROGRESSIVE: 'Có tiến bộ', NO_PROGRESS: 'Chưa tiến bộ', UNCOOPERATIVE: 'Không hợp tác' };

        return `
          <div style="display:grid;grid-template-columns:340px 1fr;gap:12px;align-items:start">
            <!-- ĐIỂM DANH QUORUM (ĐIỀU 15 NĐ 120) -->
            <div class="card" style="position:sticky;top:80px">
              <div class="card-header">Điểm danh &amp; Quorum (Điều 15 NĐ 120)</div>
              <div style="padding:13px 15px;border-bottom:1px solid #EDF1F5">
                <div style="display:flex;align-items:baseline;justify-content:space-between">
                  <span style="font-size:11.5px;color:#6C7B8B;font-weight:600">Tỷ lệ có mặt thời gian thực</span>
                  <span class="font-mono" style="font-size:24px;font-weight:700;color:${quorumOk ? GREEN : RED}">${qp}%</span>
                </div>
                <div style="height:9px;background:#EDF1F5;border-radius:3px;overflow:hidden;margin-top:7px;position:relative">
                  <div style="height:100%;width:${qp}%;background:${quorumOk ? GREEN : RED}"></div>
                  <div style="position:absolute;left:66.7%;top:0;bottom:0;width:2px;background:#0E2A47"></div>
                </div>
                <div style="font-size:11.3px;color:#6C7B8B;margin-top:6px;line-height:1.5">
                  ${quorumOk ? `Đạt quorum 2/3 (${presentCount}/${ATTENDEES.length} đại biểu).` : `Chưa đạt quorum 2/3 (${presentCount}/${ATTENDEES.length}) — không thể bắt đầu họp.`}
                </div>
              </div>

              ${ATTENDEES.map((x, i) => {
                const on = s.present[i];
                return `
                  <div style="display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid #F4F7FA">
                    <span style="flex:1;min-width:0">
                      <span style="display:block;font-size:12.5px;font-weight:600;color:#16212E">${x.n}</span>
                      <span style="display:block;font-size:11px;color:#8B98A6">${x.r}</span>
                    </span>
                    <button onclick="app.toggleAttendee(${i})" style="padding:5px 10px;border-radius:3px;font-size:11.5px;font-weight:600;border:1px solid ${on ? '#BFE0CD' : '#F0BFC3'};background:${on ? '#EDF7F1' : '#FDF0F1'};color:${on ? '#14663C' : '#96101B'};flex:none">
                      ${on ? 'Có mặt' : 'Vắng'}
                    </button>
                  </div>
                `;
              }).join('')}

              <div style="padding:12px 15px;display:flex;gap:8px">
                <button onclick="app.startMeeting()" class="btn-primary" style="flex:1;background:${quorumOk && !s.started ? NAVY : GREY}">
                  ${s.started ? 'Đang họp' : 'Bắt đầu họp'}
                </button>
                <button onclick="app.postponeMeeting()" class="btn-outline">Hoãn (${s.postpones}/2)</button>
              </div>
            </div>

            <!-- BIÊN BẢN HỌP ĐIỆN TỬ -->
            <div class="card">
              <div class="card-header">
                <div>
                  <div class="font-mono" style="font-size:11px;color:#8B98A6">HOP-202608-00042 · Định kỳ quý III/2026</div>
                  <div style="font-size:14px;font-weight:700;color:#0E2A47;margin-top:2px">Biên bản họp tư vấn điện tử — TRẦN QUỐC BẢO</div>
                </div>
                <div style="font-size:11.5px;color:#6C7B8B;text-align:right;line-height:1.5">Hội trường tầng 2, UBND xã<br>28/08/2026 · 14:00</div>
              </div>

              <div style="padding:15px 16px;display:grid;grid-template-columns:1fr 1fr;gap:13px 16px;border-bottom:1px solid #EDF1F5">
                <div>
                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#6C7B8B;font-weight:600;margin-bottom:4px">Chủ trì</div>
                  <div style="font-size:13px;font-weight:600">Ông Nguyễn Văn Thành — Chủ tịch UBND xã</div>
                </div>
                <div>
                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#6C7B8B;font-weight:600;margin-bottom:4px">Thư ký</div>
                  <div style="font-size:13px;font-weight:600">Đại úy Lê Văn Hùng — Cán bộ CSKV</div>
                </div>
              </div>

              <!-- GIỜ LAO ĐỘNG CÔNG ÍCH ĐIỀU 50 -->
              <div style="padding:12px 16px;background:#F8FAFC;border-bottom:1px solid #EDF1F5;display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:12px;color:#42505F;font-weight:600">Giờ Lao động Công ích (Điều 50 Luật 2024):</span>
                <span class="font-mono" style="font-size:12.5px;color:#1B7F4B;font-weight:700">Đã tích lũy: 22 / 16 giờ (Đạt điều kiện xét sớm)</span>
              </div>

              <div style="padding:15px 16px;display:flex;flex-direction:column;gap:13px;border-bottom:1px solid #EDF1F5">
                <div>
                  <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Báo cáo của người giúp đỡ</label>
                  <textarea rows="2" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:12.6px;resize:vertical;line-height:1.55">Trong quý, cháu Bảo trình diện đủ 12/12 lần, có 8 lượt thăm gặp tại nhà. Thái độ chuyển biến rõ, đã đi làm phụ quán ăn và phụ giúp gia đình.</textarea>
                </div>
                <div>
                  <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Ý kiến của đối tượng</label>
                  <textarea rows="2" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:12.6px;resize:vertical;line-height:1.55">Cháu xin hứa không tụ tập gây rối, chấp hành đầy đủ lịch trình diện và mong được học nghề điện dân dụng.</textarea>
                </div>
                <div>
                  <label style="display:block;font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:5px">Ý kiến của gia đình</label>
                  <textarea rows="2" style="width:100%;padding:9px 11px;border:1px solid #CFD8E1;border-radius:3px;font-size:12.6px;resize:vertical;line-height:1.55">Gia đình cam kết tiếp tục phối hợp quản lý giờ giấc buổi tối, không để cháu giao du với nhóm bạn cũ.</textarea>
                </div>
              </div>

              <div style="padding:15px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;border-bottom:1px solid #EDF1F5">
                <div>
                  <div style="font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:7px">Kết quả biểu quyết (đa số quá bán)</div>
                  <div style="display:flex;gap:8px">
                    <div style="flex:1;border:1px solid #E3E9EF;border-radius:3px;padding:9px 10px;text-align:center;background:#EDF7F1">
                      <div class="font-mono" style="font-size:19px;font-weight:700;color:#14663C">${presentCount}</div>
                      <div style="font-size:10.8px;color:#6C7B8B;margin-top:2px">Tán thành</div>
                    </div>
                    <div style="flex:1;border:1px solid #E3E9EF;border-radius:3px;padding:9px 10px;text-align:center;background:#FDF0F1">
                      <div class="font-mono" style="font-size:19px;font-weight:700;color:#96101B">0</div>
                      <div style="font-size:10.8px;color:#6C7B8B;margin-top:2px">Không tán thành</div>
                    </div>
                  </div>
                </div>
                <div>
                  <div style="font-size:11.5px;font-weight:600;color:#42505F;margin-bottom:7px">Xếp loại rèn luyện kỳ này</div>
                  <div style="display:flex;gap:6px;flex-wrap:wrap">
                    ${RAT.map(([id, l]) => `
                      <button onclick="app.setState({ rating: '${id}' })" style="padding:7px 11px;border-radius:3px;font-size:11.8px;font-weight:600;border:1px solid ${s.rating === id ? NAVY : '#CFD8E1'};background:${s.rating === id ? NAVY : '#fff'};color:${s.rating === id ? '#fff' : '#5B6B7C'}">${l}</button>
                    `).join('')}
                  </div>
                  <div style="font-size:11.3px;color:#6C7B8B;margin-top:9px;line-height:1.5">Xếp loại hiện chọn: ${RATVI[s.rating]}. Xuất sắc liên tiếp + đã chấp hành 1/2 thời hạn là căn cứ xét hoàn thành sớm.}</div>
                </div>
              </div>

              <div style="padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px">
                <div style="font-size:11.5px;color:#8B98A6;line-height:1.55;max-width:430px">Biên bản sau khi Chủ tịch UBND xã ký số sẽ xuất PDF/A kèm mã băm SHA-256 và ghi vết vào nhật ký hệ thống.</div>
                <button onclick="app.signMinutes()" class="btn-primary" style="background:${canChair && s.started && !s.signed ? RED : GREY}">
                  ${s.signed ? 'Đã ký số biên bản' : (canChair ? 'Chủ trì ký số biên bản' : 'Chỉ Chủ tịch UBND xã được ký')}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      toggleAttendee(i) {
        this.state.present[i] = !this.state.present[i];
        this.render();
      }

      startMeeting() {
        const presentCount = Object.values(this.state.present).filter(Boolean).length;
        const qp = Math.round(presentCount / ATTENDEES.length * 100);
        if (this.state.started) {
          this.flash('Cuộc họp đã bắt đầu.');
          return;
        }
        if (qp < 66.7) {
          this.flash('Chưa đạt quorum 2/3 — nút bắt đầu họp bị khóa theo BR-M04-02.', true);
          return;
        }
        this.state.started = true;
        this.log('MEETING_START', 'HOP-202608-00042', 'Bắt đầu họp · quorum ' + qp + '%');
        this.flash('Cuộc họp đã bắt đầu, biên bản điện tử được mở để ghi.');
      }

      postponeMeeting() {
        if (this.state.postpones >= 2) {
          this.flash('Đã hoãn tối đa 02 lần — hệ thống mở phương án tiến hành họp vắng mặt.', true);
          return;
        }
        this.state.postpones++;
        this.log('MEETING_POSTPONE', 'HOP-202608-00042', 'Hoãn họp lần ' + this.state.postpones);
        this.flash('Đã hoãn cuộc họp lần ' + this.state.postpones + ' (mỗi lần tối đa 02 ngày làm việc).');
      }

      signMinutes() {
        const a = this.acct();
        if (!this.can('meeting.chair')) {
          this.flash('Chỉ tài khoản Chủ tịch UBND xã được ký số biên bản họp.', true);
          return;
        }
        if (!this.state.started) {
          this.flash('Cuộc họp chưa được bắt đầu.', true);
          return;
        }
        if (this.state.signed) {
          this.flash('Biên bản đã được ký số.');
          return;

            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px">
              ${reports.map(r => `
                <div class="card" style="padding:15px 16px;display:flex;gap:14px;align-items:flex-start">
                  <div class="font-mono" style="width:38px;height:46px;flex:none;border:1px solid #D3DDE7;border-radius:2px;background:#F6F9FC;display:flex;align-items:center;justify-content:center;font-size:9px;color:#6C7B8B">BI/PDF</div>
                  <div style="flex:1;min-width:0">
                    <div style="font-size:13.2px;font-weight:700;color:#16212E">${r.name}</div>
                    <div class="font-mono" style="font-size:10.8px;color:#8B98A6;margin-top:2px">${r.code}</div>
                    <div style="font-size:11.8px;color:#6C7B8B;margin-top:6px;line-height:1.55">${r.filters}</div>
                    <div style="display:flex;gap:7px;margin-top:10px">
                      <button onclick="app.exportReport('${r.code}', 'PDF')" class="btn-primary" style="padding:6px 12px;font-size:11.8px">Kết xuất PDF/A</button>
                      <button onclick="app.exportReport('${r.code}', 'XLS')" class="btn-outline" style="padding:6px 12px;font-size:11.8px">Excel</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- SO SÁNH & XẾP HẠNG TOÀN TỈNH (DÀNH CHO LÃNH ĐẠO TỈNH) -->
            ${showRanking ? `
              <div class="card" style="padding:16px 18px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                  <div>
                    <div style="font-size:13.5px;font-weight:700;color:#0E2A47">So sánh &amp; Xếp hạng Điểm nóng An ninh Toàn Tỉnh</div>
                    <div style="font-size:11.5px;color:#6C7B8B;margin-top:2px">Đánh giá theo tỷ lệ chấp hành trình diện, tỷ lệ cảm hóa và chỉ tiêu an toàn</div>
                  </div>
                  <span style="font-size:11.5px;color:#1B7F4B;font-weight:600">Toàn tỉnh: 25 Xã/Phường</span>
                </div>
                ${ranking.map(rk => `
                  <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #F4F7FA">
                    <span class="font-mono" style="font-size:11.5px;color:#8B98A6;width:20px">${rk.n}</span>
                    <span style="width:190px;font-size:12.5px;font-weight:600;color:#16212E">${rk.unit}</span>
                    <span style="flex:1;height:8px;background:#EDF1F5;border-radius:3px;overflow:hidden"><span style="display:block;height:100%;width:${rk.pct};background:${rk.color}"></span></span>
                    <span class="font-mono" style="font-size:12px;font-weight:600;color:#0E2A47;width:52px;text-align:right">${rk.pct}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      exportReport(code, type) {
        const a = this.acct();
        if (type === 'PDF') {
          this.log('EXPORT_PDF', code, 'Kết xuất PDF · ' + a.scopeText);
          this.flash(code + ': đã kết xuất PDF/A có chữ ký số (watermark ' + a.name + ') và ghi vết.');
        } else {
          this.log('EXPORT_XLSX', code, 'Kết xuất Excel · ' + a.scopeText);
          this.flash(code + ': đã kết xuất Excel chuẩn công thức và ghi vết.');
        }
      }
    }

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    const app = new AppController();
    window.app = app;
    window.addEventListener('DOMContentLoaded', () => app.render());
  </script>
</body>
</html>
